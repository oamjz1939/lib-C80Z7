name: Release

on:
  push:
    tags:
      - 'v*' # 匹配类似 v1.0.0 的 tag

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # 自动生成 release notes
